        figure tr,

    </main>
    <script>
      const input = document.getElementById('search');
      const count = document.getElementById('search-count');
      const rows = document.querySelectorAll('figure tbody tr');
      const total = rows.length;

      function updateCount(visible) {
        count.textContent = input.value ? visible + ' / ' + total + ' talks' : total + ' talks';
      }

      input.addEventListener('input', function () {
        const terms = this.value.toLowerCase().split(/\s+/).filter(Boolean);
        let visible = 0;
        rows.forEach(function (row) {
          const text = row.textContent.toLowerCase();
          const match = terms.every(function (t) { return text.includes(t); });
          row.style.display = match ? '' : 'none';
          if (match) visible++;
        });
        updateCount(visible);
      });

      updateCount(total);
    </script>
