      main.container { padding-block: 1.5rem; }

      .source-link { font-size: 0.9rem; margin-bottom: 1rem; }
      a { text-decoration: none; }
      a:hover { text-decoration: underline; }

      #search {
        padding: 0.4rem 0.6rem 0.4rem 2.5rem;
        font-size: 0.9rem;

        height: auto;

      .search-count {

        margin-top: 0.3rem;
        margin-bottom: 0.75rem;
      }

      figure { overflow-x: auto; margin: 0; }
      table { width: 100%; }
      thead th {

        top: 0;

        z-index: 1;
      }
      .year-badge {
        color: var(--pico-muted-color);
        font-size: 0.85em;
        text-decoration: none;
        white-space: nowrap;
      }
      .year-badge:hover { text-decoration: underline; }

      /* スマホ: テーブルをカードレイアウトへ変換 */
      @media (max-width: 640px) {
        main.container { padding-inline: 1rem; }
        figure thead { display: none; }
        figure table,
        figure tbody,
        figure tr,
        figure td {
          display: block;
          width: 100%;
        }
        figure tr {
          padding: 0.85rem 0;
          border-bottom: 1px solid var(--pico-muted-border-color);
        }
        figure tr:last-child { border-bottom: none; }
        figure td {
          padding: 0.15rem 0;
          border: none;
        }
        figure td.year { margin-bottom: 0.4rem; }
        figure td.name a { font-weight: 600; }

    <script>
      const input = document.getElementById('search');
      const count = document.getElementById('search-count');
      const rows = document.querySelectorAll('figure tbody tr');
      const total = rows.length;

      function updateCount(visible) {
        count.textContent = input.value ? visible + ' / ' + total + ' talks' : total + ' talks';
      }

      input.addEventListener('input', function () {
        const terms = this.value.toLowerCase().split(/\s+/).filter(Boolean);
        let visible = 0;
        rows.forEach(function (row) {
          const text = row.textContent.toLowerCase();
          const match = terms.every(function (t) { return text.includes(t); });
          row.style.display = match ? '' : 'none';
          if (match) visible++;
        });
        updateCount(visible);
      });

      updateCount(total);
    </script>
